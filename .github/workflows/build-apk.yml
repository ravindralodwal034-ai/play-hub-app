name: Build Play Hub APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK, Licenses and Keystore
        run: |
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            mkdir -p "$SDK_DIR/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n601085b94cd77f0b54ff86406957099ebe79c4d6" > "$SDK_DIR/licenses/android-sdk-license"
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"

            SDKM=$(command -v sdkmanager || find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$SDKM" ]; then
              (yes || true) | "$SDKM" --licenses >/dev/null 2>&1 || true
              "$SDKM" "platforms;android-36.1" "platforms;android-36" "platform-tools" >/dev/null 2>&1 || true
            fi

            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              ls -lh debug.keystore
            fi
            touch .env
          } 2>&1 | tee gradle_build.log

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2 \
            --no-daemon \
            --stacktrace 2>&1 | tee -a gradle_build.log

      - name: Show Failure Summary
        if: failure()
        run: |
          echo "### Gradle Build Error" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -s gradle_build.log ]; then
            tail -n 60 gradle_build.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build failed before Gradle ran." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Play Hub APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayHub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
